services:
  cheapies-watcher:
    build: .
    container_name: cheapies-watcher
    restart: unless-stopped
    environment:
      - INTERVAL_SECONDS=28800   # how often to check (seconds); 28800 = every 8 hours (3x/day)
      - ALWAYS_DEEP_SCAN=true    # deep-scan multiple pages on every run, not just the first
      - MAX_PAGES=20             # pages per scan; stops early once it hits already-seen deals
    volumes:
      - ./data/config.json:/app/data/config.json:ro
      - ./data/state.json:/app/data/state.json
